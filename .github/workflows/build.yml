name: Build Multi-Platform (Android / iOS / macOS / Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      flutter_channel:
        description: 'Flutter Channel (stable / beta / master)'
        required: false
        default: 'stable'
      create_release:
        description: 'Create GitHub Release after build'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: AuraMusic
  FLUTTER_CHANNEL: ${{ inputs.flutter_channel || 'stable' }}

jobs:
  # ============================================================================
  # 1. Android Build (APK + AppBundle)
  # ============================================================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Ensure Android platform files exist
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=flutter_music
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Prepare Android artifacts
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/${{ env.APP_NAME }}-Android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/${{ env.APP_NAME }}-Android-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/${{ env.APP_NAME }}-Android-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/${{ env.APP_NAME }}-Android-x86_64.apk || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Android-APK
          path: dist/android/*
          retention-days: 30

  # ============================================================================
  # 2. iOS Build (Unsigned IPA Package)
  # ============================================================================
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Ensure iOS platform files exist
        run: |
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios --project-name=flutter_music
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package Runner.app into .ipa
        run: |
          mkdir -p dist/ios Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/ios/${{ env.APP_NAME }}-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-iOS-IPA
          path: dist/ios/${{ env.APP_NAME }}-iOS-unsigned.ipa
          retention-days: 30

  # ============================================================================
  # 3. macOS Build (.app.zip & .dmg)
  # ============================================================================
  build-macos:
    name: Build macOS (DMG & App)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable macOS Desktop & Ensure Platform Scaffolding
        run: |
          flutter config --enable-macos-desktop
          if [ ! -d "macos" ]; then
            flutter create . --platforms=macos --project-name=flutter_music
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package macOS .app into .dmg and .zip
        run: |
          mkdir -p dist/macos dmg_staging
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found macOS App at: $APP_PATH"
          cp -R "$APP_PATH" "dmg_staging/${{ env.APP_NAME }}.app"
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder dmg_staging -ov -format UDZO "dist/macos/${{ env.APP_NAME }}-macOS.dmg"
          cd build/macos/Build/Products/Release
          zip -qry "${{ github.workspace }}/dist/macos/${{ env.APP_NAME }}-macOS-app.zip" *.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-DMG
          path: dist/macos/*
          retention-days: 30

  # ============================================================================
  # 4. Windows Build (x64 Portable ZIP)
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows Desktop & Ensure Platform Scaffolding
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          if (-not (Test-Path "windows")) {
            flutter create . --platforms=windows --project-name=flutter_music
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release --no-tree-shake-icons

      - name: Package Windows Release into ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "dist/windows/${{ env.APP_NAME }}-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x64
          path: dist/windows/${{ env.APP_NAME }}-Windows-x64.zip
          retention-days: 30

  # ============================================================================
  # 5. Publish GitHub Release (Triggered on Tag v*.*.* or manual dispatch option)
  # ============================================================================
  release:
    name: Publish Multi-Platform Release
    needs: [ build-android, build-ios, build-macos, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Collect All Packages
        run: |
          mkdir -p publish_files
          find release_assets -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} publish_files/ \;
          ls -lh publish_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "${{ env.APP_NAME }} Multi-Platform Release (${{ github.run_number }})"
          files: publish_files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
