name: Build Multi-Platform (Android / iOS / macOS / Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      flutter_channel:
        description: 'Flutter Channel (stable / beta / master)'
        required: false
        default: 'stable'
      create_release:
        description: 'Create GitHub Release after build'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: AuraMusic
  FLUTTER_CHANNEL: ${{ inputs.flutter_channel || 'stable' }}

jobs:
  # ============================================================================
  # 1. Android Build (APK)
  # ============================================================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Ensure Android platform files exist
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=flutter_music
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Universal Release APK
        run: |
          mkdir -p dist/android
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/${{ env.APP_NAME }}-Android-universal.apk

      - name: Build Android Split-per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/${{ env.APP_NAME }}-Android-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/${{ env.APP_NAME }}-Android-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/${{ env.APP_NAME }}-Android-x86_64.apk || true
          ls -lh dist/android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Android-APK
          path: dist/android/*
          retention-days: 30

  # ============================================================================
  # 2. iOS Build (Unsigned IPA Package)
  # ============================================================================
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Ensure iOS platform files exist
        run: |
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios --project-name=flutter_music
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package Runner.app into .ipa
        run: |
          mkdir -p dist/ios Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/ios/${{ env.APP_NAME }}-iOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh dist/ios/

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-iOS-IPA
          path: dist/ios/${{ env.APP_NAME }}-iOS-unsigned.ipa
          retention-days: 30

  # ============================================================================
  # 3. macOS Build (.app.zip & .dmg)
  # ============================================================================
  build-macos:
    name: Build macOS (DMG & App)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable macOS Desktop & Ensure Platform Scaffolding
        run: |
          flutter config --enable-macos-desktop
          if [ ! -d "macos" ]; then
            flutter create . --platforms=macos --project-name=flutter_music
          fi
          # Inject custom AuraMusic AppIcon PNGs
          cp -f assets/macos_icons/*.png macos/Runner/Assets.xcassets/AppIcon.appiconset/
          # Inject native AVPlayer + NSOpenPanel bridge & 360x600 min window size
          cp -f assets/macos_bridge/MainFlutterWindow.swift macos/Runner/MainFlutterWindow.swift
          # Ensure user-selected file read access & disable strict sandbox blocking local Music folder scans
          for ent in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            if [ -f "$ent" ]; then
              /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$ent" 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package macOS .app into .zip and .dmg
        run: |
          mkdir -p "${{ github.workspace }}/dist/macos"
          cd build/macos/Build/Products/Release
          zip -qry "${{ github.workspace }}/dist/macos/${{ env.APP_NAME }}-macOS-app.zip" *.app
          cd "${{ github.workspace }}"
          mkdir -p dmg_staging
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          cp -R "$APP_PATH" "dmg_staging/${{ env.APP_NAME }}.app"
          ln -s /Applications dmg_staging/Applications
          for i in 1 2 3; do
            hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder dmg_staging -ov -format UDZO "dist/macos/${{ env.APP_NAME }}-macOS.dmg" && break || sleep 3
          done
          ls -lh dist/macos/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-DMG
          path: dist/macos/*
          retention-days: 30

  # ============================================================================
  # 4. Windows Build (x64 Portable ZIP)
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows Desktop & Ensure Platform Scaffolding
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          if (-not (Test-Path "windows")) {
            flutter create . --platforms=windows --project-name=flutter_music
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release --no-tree-shake-icons

      - name: Package Windows Release into ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "dist/windows/${{ env.APP_NAME }}-Windows-x64.zip" -Force
          Get-ChildItem "dist/windows"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-x64
          path: dist/windows/${{ env.APP_NAME }}-Windows-x64.zip
          retention-days: 30

  # ============================================================================
  # 5. Publish GitHub Release (Runs with always() as long as at least 1 build succeeded)
  # ============================================================================
  release:
    name: Publish Multi-Platform Release
    needs: [ build-android, build-ios, build-macos, build-windows ]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build-android.result == 'success' ||
       needs.build-ios.result == 'success' ||
       needs.build-macos.result == 'success' ||
       needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: publish_files
          merge-multiple: true

      - name: Verify Downloaded Release Assets
        run: |
          ls -la publish_files/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: "${{ env.APP_NAME }} ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}"
          body: |
            ### 🎵 ${{ env.APP_NAME }} 多平台自动构建发布 (Build #${{ github.run_number }})
            - **Commit**: `${{ github.sha }}`
            - **各平台构建状态**：
              - 📱 **Android**: `${{ needs.build-android.result }}`
              - 🍎 **iOS**: `${{ needs.build-ios.result }}`
              - 💻 **macOS**: `${{ needs.build-macos.result }}`
              - 🖥️ **Windows**: `${{ needs.build-windows.result }}`
          files: |
            publish_files/*.apk
            publish_files/*.ipa
            publish_files/*.dmg
            publish_files/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
